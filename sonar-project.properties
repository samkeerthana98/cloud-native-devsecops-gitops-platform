# SonarCloud project configuration
# Replace the two placeholder values below before enabling SonarCloud in CI.
#
# How to find them:
#   - Log in to https://sonarcloud.io
#   - Import this GitHub repository as a new project
#   - Copy the organization key and project key from the project's Information page

sonar.organization=YOUR_SONARCLOUD_ORG
sonar.projectKey=YOUR_SONARCLOUD_PROJECT_KEY

sonar.projectName=Cloud-Native DevSecOps & GitOps Delivery Platform
sonar.projectVersion=0.1.0

# Source and test paths
sonar.sources=app
sonar.tests=tests
sonar.language=py

# Python coverage report (generate with: pytest --cov=app --cov-report=xml)
# Uncomment after adding pytest-cov to requirements.txt and running coverage locally.
# sonar.python.coverage.reportPaths=coverage.xml
