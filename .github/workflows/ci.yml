name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -v

  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: "1"
          format: table

      # SonarCloud analysis — runs only when SONAR_ENABLED repository variable is 'true'.
      # Setup required before enabling:
      #   1. Create a project at https://sonarcloud.io (import the GitHub repo).
      #   2. Set the correct sonar.organization and sonar.projectKey in sonar-project.properties.
      #   3. Add SONAR_TOKEN as a repository secret (Settings → Secrets → Actions).
      #   4. Add SONAR_ENABLED = true as a repository variable (Settings → Variables → Actions).
      - name: SonarCloud analysis
        if: vars.SONAR_ENABLED == 'true'
        uses: SonarSource/sonarcloud-github-action@v5.0.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Run only after both test and scan succeed.
    # SonarCloud is conditional inside scan; its skip does not block this job.
    needs: [test, scan]
    # Push to the default branch only — not on pull requests or other branches.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Log in to Docker Hub
        uses: docker/login-action@v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          push: true
          # Tag with short commit SHA for immutability; never tag 'latest' as the sole tag.
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/devsecops-app:${{ github.sha }}
